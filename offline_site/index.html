<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="referrer" content="origin-when-cross-origin">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Coach Adib · Portal Video & Sistem Bisnes</title>
  <script src="marked.min.js"></script>
  <script src="hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff5a00;
      --primary-hover: #ff7324;
      --primary-glow: rgba(255, 90, 0, 0.28);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.24);
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --rose: #f43f5e;
      --purple: #8b5cf6;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --topbar-height: 68px;
      --max-width: 1040px;
    }

    /* Dark Obsidian Theme (Official Coach Adib) */
    html.dark {
      --bg-base: #090c10;
      --bg-surface: #0f141c;
      --bg-card: #151b26;
      --bg-card-hover: #1c2433;
      --bg-elevated: #1e2738;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(255, 90, 0, 0.55);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --text-muted: #475569;

      --topbar-bg: rgba(9, 12, 16, 0.88);
      --code-bg: #0b0e14;
      --table-th-bg: #111722;
      --quiz-card-bg: rgba(15, 20, 28, 0.7);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.25);
      --shadow-hero: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    /* Light Theme */
    html.light {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-elevated: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-medium: rgba(0, 0, 0, 0.14);
      --border-focus: rgba(255, 90, 0, 0.6);
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #64748b;
      --text-muted: #94a3b8;

      --topbar-bg: rgba(255, 255, 255, 0.92);
      --code-bg: #f1f5f9;
      --table-th-bg: #f8fafc;
      --quiz-card-bg: #f8fafc;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06);
      --shadow-hero: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(140, 140, 140, 0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(140, 140, 140, 0.45); }

    /* Top Navigation Bar */
    .topbar {
      height: var(--topbar-height);
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--topbar-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .topbar-container {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .brand-logo-img {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      object-fit: contain;
      background: #000;
      border: 1px solid var(--border-subtle);
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-pill {
      font-size: 0.65rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 90, 0, 0.12);
      color: var(--primary);
      border: 1px solid rgba(255, 90, 0, 0.3);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .search-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }
    .search-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      background: rgba(140, 140, 140, 0.15);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }

    .overall-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--emerald);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Main Container */
    .main-wrapper {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px 100px 20px;
    }

    /* View 1: Home View Components */
    .home-hero {
      position: relative;
      min-height: 180px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: linear-gradient(135deg, rgba(255, 90, 0, 0.12) 0%, rgba(15, 20, 28, 0.95) 100%);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-hero);
      margin-bottom: 28px;
    }
    .home-hero-eyebrow {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    :root {
      --slogan-glow-rgb: 255, 90, 0;
      --slogan-glow-bg: linear-gradient(135deg, rgba(255, 90, 0, 0.2) 0%, rgba(255, 140, 0, 0.28) 100%);
      --slogan-glow-border: rgba(255, 90, 0, 0.5);
      --slogan-glow-shadow: 0 4px 16px rgba(255, 90, 0, 0.22);
      --slogan-text-grad: linear-gradient(90deg, #ff5a00 0%, #ff8c00 50%, #ffd200 100%);
    }

    @keyframes slotQuake3DHard {
      0% {
        transform: perspective(900px) translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
        box-shadow: 0 4px 14px rgba(var(--slogan-glow-rgb), 0.2);
      }
      10% {
        transform: perspective(900px) translate3d(-8px, -5px, 22px) rotateX(-18deg) rotateY(20deg) rotateZ(-4deg) scale(1.15);
        box-shadow: -8px 8px 25px rgba(var(--slogan-glow-rgb), 0.55);
      }
      22% {
        transform: perspective(900px) translate3d(9px, 6px, 32px) rotateX(20deg) rotateY(-22deg) rotateZ(5deg) scale(1.22);
        box-shadow: 8px -8px 32px rgba(var(--slogan-glow-rgb), 0.65);
      }
      35% {
        transform: perspective(900px) translate3d(-10px, 4px, 26px) rotateX(-16deg) rotateY(16deg) rotateZ(-5deg) scale(1.18);
        box-shadow: -10px -6px 28px rgba(var(--slogan-glow-rgb), 0.58);
      }
      48% {
        transform: perspective(900px) translate3d(8px, -6px, 30px) rotateX(18deg) rotateY(-14deg) rotateZ(4deg) scale(1.19);
        box-shadow: 10px 6px 30px rgba(var(--slogan-glow-rgb), 0.6);
      }
      62% {
        transform: perspective(900px) translate3d(-6px, 3px, 18px) rotateX(-10deg) rotateY(12deg) rotateZ(-3deg) scale(1.12);
        box-shadow: -6px 4px 22px rgba(var(--slogan-glow-rgb), 0.45);
      }
      75% {
        transform: perspective(900px) translate3d(5px, -3px, 12px) rotateX(8deg) rotateY(-8deg) rotateZ(2deg) scale(1.07);
        box-shadow: 5px -3px 18px rgba(var(--slogan-glow-rgb), 0.35);
      }
      88% {
        transform: perspective(900px) translate3d(-3px, 2px, 6px) rotateX(-4deg) rotateY(4deg) rotateZ(-1deg) scale(1.03);
        box-shadow: -3px 2px 14px rgba(var(--slogan-glow-rgb), 0.25);
      }
      100% {
        transform: perspective(900px) translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
        box-shadow: 0 4px 14px rgba(var(--slogan-glow-rgb), 0.2);
      }
    }

    .home-hero-slot-headline {
      font-size: clamp(1.45rem, 3.6vw, 2.3rem);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      margin: 6px 0 10px 0;
      line-height: 1.25;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      perspective: 900px;
      transition: transform 0.15s ease;
    }
    .home-hero-slot-headline:hover {
      transform: translateY(-1px);
    }
    .home-hero-slot-headline:hover .slot-chip-box {
      border-color: rgba(var(--slogan-glow-rgb), 0.85);
      box-shadow: 0 6px 24px rgba(var(--slogan-glow-rgb), 0.45);
    }
    .slot-prefix-text {
      color: var(--text-primary);
      font-weight: 800;
    }
    .slot-chip-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 3px 12px;
      border-radius: var(--radius-md);
      background: var(--slogan-glow-bg);
      border: 1.5px solid var(--slogan-glow-border);
      box-shadow: var(--slogan-glow-shadow);
      transform-style: preserve-3d;
      transition: transform 0.15s ease, border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      transform-origin: center center;
    }
    .slot-chip-box.quake-hard {
      animation: slotQuake3DHard 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    .slot-keyword {
      background: var(--slogan-text-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .slot-emojis {
      font-style: normal;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
      font-size: 1.05em;
    }
    .slot-shuffle-icon {
      font-size: 0.85rem;
      opacity: 0.55;
      transition: transform 0.3s ease, opacity 0.2s ease;
      margin-left: 2px;
    }
    .home-hero-slot-headline:hover .slot-shuffle-icon {
      opacity: 1;
      transform: rotate(180deg) scale(1.15);
    }
    .home-hero-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .program-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 768px) {
      .program-grid { grid-template-columns: 1fr; }
      .home-hero { padding: 20px; min-height: 160px; }
      .main-wrapper { padding: 20px 14px 80px 14px; }
    }

    /* Program Card (kne) */
    .program-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 230px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-card);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .program-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 90, 0, 0.4);
      background: var(--bg-card-hover);
      box-shadow: 0 8px 30px rgba(255, 90, 0, 0.12);
    }
    .program-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .program-code {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--primary);
    }
    .tag-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tag-amber {
      background: rgba(245, 158, 11, 0.12);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .tag-emerald {
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .program-card-body {
      flex: 1;
    }
    .program-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
    }
    .program-card-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.45;
    }

    .program-card-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .prog-bar-track {
      width: 100%;
      height: 6px;
      background: rgba(140, 140, 140, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .prog-bar-fill-orange {
      height: 100%;
      background: linear-gradient(90deg, #ff5a00, #ff8c00);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .prog-bar-fill-green {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .program-card-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-tertiary);
      font-weight: 500;
    }
    .program-arrow {
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 800;
    }

    /* Navigation Breadcrumbs & Back Button */
    .page-nav-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn-back {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-back:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }
    .breadcrumb-trail {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-tertiary);
      overflow: hidden;
      white-space: nowrap;
    }
    .breadcrumb-trail a {
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
    }
    .breadcrumb-trail a:hover {
      color: var(--text-primary);
      text-decoration: underline;
    }
    .breadcrumb-trail .current {
      color: var(--text-primary);
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* View 2: Program View (`/program/:id`) */
    .program-header-hero {
      margin-bottom: 28px;
    }
    .program-header-title {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .program-header-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-top: 8px;
      max-width: 650px;
      line-height: 1.5;
    }

    .course-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-card);
      transition: all 0.18s ease;
    }
    .course-card:hover {
      transform: translateY(-2px);
      background: var(--bg-card-hover);
      border-color: rgba(255, 90, 0, 0.35);
    }
    .course-icon-box {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-md);
      background: rgba(255, 90, 0, 0.12);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .course-card-content {
      flex: 1;
      min-width: 0;
    }
    .course-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .course-card-meta {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      margin-top: 3px;
    }
    .course-card-chevron {
      color: var(--text-tertiary);
      font-size: 1.2rem;
      margin-left: 8px;
    }

    /* View 3: Course View (`/course/:id`) */
    .chapter-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .chapter-bar {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: rgba(140, 140, 140, 0.03);
    }
    .chapter-bar-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chapter-toggle-icon {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      transition: transform 0.2s ease;
    }
    .chapter-section.collapsed .chapter-toggle-icon {
      transform: rotate(-90deg);
    }
    .chapter-section.collapsed .chapter-modules-list {
      display: none;
    }
    .chapter-badge-count {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
    }

    .chapter-modules-list {
      display: flex;
      flex-direction: column;
      divide-y: 1px solid var(--border-subtle);
    }
    .lesson-row {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background 0.12s ease;
    }
    .lesson-row:hover {
      background: var(--bg-card-hover);
    }
    .lesson-row.completed .lesson-row-title {
      color: var(--text-muted);
    }
    .lesson-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .lesson-play-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 90, 0, 0.1);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      flex-shrink: 0;
    }
    .lesson-play-icon.done {
      background: rgba(16, 185, 129, 0.14);
      color: var(--emerald);
    }
    .lesson-row-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lesson-row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .lesson-pill-duration {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-tertiary);
    }

    /* View 4: Module / Video View (`/module/:id`) */
    .module-video-card {
      background: #000000;
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }
    .module-video-card.theater {
      border-radius: 0;
      margin-left: calc(-1 * max(20px, calc((100vw - var(--max-width)) / 2)));
      margin-right: calc(-1 * max(20px, calc((100vw - var(--max-width)) / 2)));
      max-width: 100vw;
    }
    .video-toolbar {
      padding: 10px 18px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .video-stream-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--emerald);
      font-family: 'JetBrains Mono', monospace;
    }
    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }
    .video-quick-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn {
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      font-weight: 600;
    }
    .ctrl-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .ctrl-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .video-player-frame {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }
    .video-player-frame iframe, .video-player-frame video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .module-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .module-title {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      line-height: 1.2;
    }
    .module-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-action {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-mark-done {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.25);
    }
    .btn-mark-done:hover {
      background: #059669;
    }
    .btn-done-active {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: var(--emerald);
    }
    .btn-bookmark {
      background: var(--bg-card);
      border-color: var(--border-subtle);
      color: var(--text-secondary);
    }
    .btn-bookmark:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .btn-bookmark.saved {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
      color: var(--amber);
    }

    /* Status Notices & Banners (Matching coachadib.com One/iD component) */
    .status-notice-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      font-size: 0.88rem;
      line-height: 1.5;
      margin: 14px 0 18px 0;
    }
    .status-notice-banner.notice-amber {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .dark .status-notice-banner.notice-amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.35);
    }
    .status-notice-banner.notice-emerald {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .dark .status-notice-banner.notice-emerald {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.35);
    }
    .notice-icon {
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .notice-text {
      flex: 1;
      font-weight: 500;
    }

    .status-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 9999px;
      padding: 4px 11px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      text-decoration: none;
    }
    .status-badge-pill.pill-amber {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .dark .status-badge-pill.pill-amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.35);
    }
    .status-badge-pill.pill-emerald {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .dark .status-badge-pill.pill-emerald {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.35);
    }

    /* Module Action Buttons */
    .module-action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 20px 0;
    }
    .btn-module-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 20px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid transparent;
      box-shadow: var(--shadow-card);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-module-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    .btn-module-action.btn-blue {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-module-action.btn-blue:hover {
      background: #1d4ed8;
    }
    .btn-module-action.btn-emerald, .btn-module-action.btn-green {
      background: #059669;
      color: #ffffff;
    }
    .btn-module-action.btn-emerald:hover, .btn-module-action.btn-green:hover {
      background: #047857;
    }
    .btn-module-action.btn-orange, .btn-module-action.btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-module-action.btn-orange:hover, .btn-module-action.btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-module-action.btn-black {
      background: #111827;
      color: #ffffff;
    }
    .btn-module-action.btn-outline {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }

    /* Note Tabs Section */
    .note-tabs-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 22px;
      margin-top: 20px;
      box-shadow: var(--shadow-card);
    }
    .note-tabs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .note-tabs-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .note-tab-btn {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid transparent;
      background: rgba(140, 140, 140, 0.1);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .note-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-copy-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-copy-tab:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-medium);
    }
    .note-tab-content {
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-lg);
      padding: 18px;
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      margin: 0;
    }
    .note-tab-content.active {
      display: block;
    }

    /* Course Playlist Carousel */
    .course-playlist-section {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 22px;
      margin-top: 24px;
      box-shadow: var(--shadow-card);
    }
    .playlist-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .playlist-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }
    .playlist-course-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 2px;
    }
    .playlist-stat {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }
    .playlist-progress-bar {
      height: 6px;
      background: rgba(140, 140, 140, 0.15);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .playlist-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff5a00, #ff8c00);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }
    .playlist-scroll-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
    }
    .playlist-chapter-card {
      width: 180px;
      flex-shrink: 0;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, #ff5a00 0%, #ff8c00 100%);
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      scroll-snap-align: start;
      box-shadow: 0 4px 14px rgba(255, 90, 0, 0.25);
    }
    .playlist-chapter-num {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      font-family: 'JetBrains Mono', monospace;
    }
    .playlist-chapter-title {
      font-size: 1.02rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-top: auto;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .playlist-item-card {
      width: 200px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 8px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.18s ease;
      scroll-snap-align: start;
    }
    .playlist-item-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .playlist-item-card.active {
      border-color: var(--primary);
      background: rgba(255, 90, 0, 0.08);
      box-shadow: 0 0 0 2px var(--primary);
    }
    .playlist-thumb-box {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      background: #000;
    }
    .playlist-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .playlist-done-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #10b981;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .playlist-now-badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: var(--primary);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }
    .playlist-duration-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .playlist-item-body {
      padding: 2px 4px 4px 4px;
    }
    .playlist-item-num {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--primary);
      font-family: 'JetBrains Mono', monospace;
    }
    .playlist-item-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }

    .module-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }
    .btn-nav-step {
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      transition: all 0.15s ease;
    }
    .btn-nav-step:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-medium);
    }
    .btn-nav-step.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 12px var(--primary-glow);
    }
    .btn-nav-step.primary:hover {
      background: var(--primary-hover);
    }

    /* Study Notes & Markdown Typography */
    .study-notes-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 28px;
      margin-top: 20px;
      box-shadow: var(--shadow-card);
    }
    .study-notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .study-notes-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .markdown-body {
      font-size: 0.95rem;
      color: var(--text-primary);
      line-height: 1.74;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      font-weight: 800;
      margin-top: 1.5em;
      margin-bottom: 0.6em;
      color: var(--text-primary);
    }
    .markdown-body h1 { font-size: 1.4rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; }
    .markdown-body h2 { font-size: 1.2rem; }
    .markdown-body h3 { font-size: 1.05rem; }
    .markdown-body p { margin-bottom: 1.1em; }
    .markdown-body ul, .markdown-body ol { margin-left: 1.4em; margin-bottom: 1.1em; }
    .markdown-body li { margin-bottom: 0.35em; }
    .markdown-body blockquote {
      border-left: 3px solid var(--primary);
      padding: 8px 16px;
      margin: 1.2em 0;
      background: rgba(255, 90, 0, 0.05);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      color: var(--text-secondary);
      font-style: italic;
    }
    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      padding: 2px 6px;
      background: var(--code-bg);
      border-radius: 4px;
      color: var(--primary);
    }
    .markdown-body pre {
      background: var(--code-bg);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 1.2em 0;
      border: 1px solid var(--border-subtle);
    }
    .markdown-body pre code { background: transparent; padding: 0; color: var(--text-primary); }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: 0.88rem; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border-subtle); padding: 9px 12px; text-align: left; }
    .markdown-body th { background: var(--table-th-bg); font-weight: 700; }

    /* Interactive Quizzes */
    .quiz-card {
      background: var(--quiz-card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-top: 14px;
    }
    .quiz-q-title {
      font-size: 0.94rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quiz-btn {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.84rem;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .quiz-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .quiz-btn.correct {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--emerald);
      color: var(--emerald);
      font-weight: 700;
    }
    .quiz-btn.wrong {
      background: rgba(244, 63, 94, 0.18);
      border-color: var(--rose);
      color: var(--rose);
    }
    .quiz-explanation {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--text-primary);
      display: none;
    }

    /* Global Search Modal */
    .search-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 80px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .search-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .search-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      max-width: 620px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .search-dialog-input-row {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-dialog-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1rem;
      color: var(--text-primary);
      font-family: inherit;
    }
    .search-results-list {
      max-height: 420px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .search-result-item {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.12s ease;
    }
    .search-result-item:hover {
      background: var(--bg-card-hover);
    }
    .search-result-title {
      font-size: 0.88rem;
      font-weight: 600;
    }
    .search-result-badge {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;

    function applyTheme(theme) {
      currentTheme = theme;

    function toggleTheme() {

    function showToast(msg, icon = '⚡') {
      const toast = document.getElementById('toast');

      if (!toast) return;
      iconEl.innerText = icon;
      msgEl.innerText = msg;
      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function triggerConfetti(customColors = null) {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = [];
      const colors = customColors || ['#ff5a00', '#10b981', '#06b6d4', '#f59e0b', '#8b5cf6', '#ffffff'];
      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2, y: canvas.height / 2, r: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.7) * 16,
          gravity: 0.35, tilt: Math.random() * 10, tiltAngle: 0, tiltAngleInc: Math.random() * 0.1 + 0.05, alpha: 1
        });
      }
      let animId;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.alpha -= 0.015;
          p.tiltAngle += p.tiltAngleInc; p.tilt = Math.sin(p.tiltAngle) * 10;
          if (p.alpha > 0) {
            alive = true; ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color;
            ctx.moveTo(p.x + p.tilt + p.r / 2, p.y); ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2); ctx.stroke();
          }
        });
        if (alive) animId = requestAnimationFrame(render);
        else { ctx.clearRect(0, 0, canvas.width, canvas.height); cancelAnimationFrame(animId); }
      }
      render();
    }

    function updateOverallProgress() {
      const total = modules.length;
      const done = completedSet.size;
      const pct = Math.round((done / (total || 1)) * 100) || 0;
      const el = document.getElementById('overall-pct');
      if (el) el.innerText = `${pct}%`;

    function parseVideoInfo(videoUrl) {
      if (!videoUrl) return null;
      const match = videoUrl.match(/(?:iframe\.mediadelivery\.net\/(?:embed|play)|player\.mediadelivery\.net\/play)\/(\d+)\/([\w-]+)/i) ||
                    videoUrl.match(/([0-9]{5,8})\/([a-f0-9-]{36})/i);
      if (match) {
        return { libraryId: match[1], videoId: match[2], embedUrl: `https://iframe.mediadelivery.net/embed/${match[1]}/${match[2]}` };
      }
      const rawUuid = videoUrl.match(/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/i);
      if (rawUuid) {
        return { libraryId: '753332', videoId: rawUuid[1], embedUrl: `https://iframe.mediadelivery.net/embed/753332/${rawUuid[1]}` };
      }
      return null;
    }

      } else {

    let currentSloganIndex = 0;
    let sloganInterval = null;

    function applySloganTheme(item) {
      if (!item) return;
      const root = document.documentElement;
      root.style.setProperty('--slogan-glow-rgb', item.rgb);
      root.style.setProperty('--slogan-glow-border', item.border);
      root.style.setProperty('--slogan-glow-bg', item.bg);
      root.style.setProperty('--slogan-glow-shadow', `0 4px 16px rgba(${item.rgb}, 0.25)`);
      root.style.setProperty('--slogan-text-grad', item.textGrad);
    }

    function shuffleHeroSlogan(isManual = false) {
      const chipEl = document.getElementById('slot-chip-box');
      if (!chipEl) return;

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * HERO_SLOGAN_ITEMS.length);
      } while (nextIndex === currentSloganIndex && HERO_SLOGAN_ITEMS.length > 1);
      currentSloganIndex = nextIndex;
      const nextItem = HERO_SLOGAN_ITEMS[currentSloganIndex];

      if (isManual) {
        triggerConfetti(nextItem.confetti);
      }

      chipEl.classList.remove('quake-hard');
      void chipEl.offsetWidth; // Reflow to re-trigger animation
      chipEl.classList.add('quake-hard');

      setTimeout(() => {
        applySloganTheme(nextItem);
        chipEl.innerHTML = `<span class="slot-keyword">${nextItem.word}</span> <span class="slot-emojis">${nextItem.emoji}</span>`;
        if (isManual) {
          showToast(`Kakngoh - ${nextItem.word} ${nextItem.emoji}`, nextItem.toastIcon);
        }
      }, 160);

      setTimeout(() => {
        if (chipEl) chipEl.classList.remove('quake-hard');
      }, 560);
    }

    function startSloganRotation() {
      clearInterval(sloganInterval);
      sloganInterval = setInterval(() => {
        if (!document.getElementById('slot-chip-box')) {
          clearInterval(sloganInterval);
          return;
        }
        shuffleHeroSlogan(false);
      }, 3600000); // 1 jam = 3,600,000 ms
    }

            </div>
            ${mod.quiz.map((q, idx) => `
              <div class="quiz-card">
                <div class="quiz-q-title">${idx + 1}. ${q.question}</div>
                <div class="quiz-options">
                  ${(q.options || []).map((opt, oIdx) => `
                    <button class="quiz-btn" onclick="checkQuiz(this, ${oIdx}, ${q.correct_answer || 0}, '${(q.explanation || '').replace(/'/g, "\\'")}')">
                      <span>${String.fromCharCode(65 + oIdx)}.</span>
                      <span>${opt}</span>
                    </button>
                  `).join('')}
                </div>
                <div class="quiz-explanation"></div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${playlist.items.length > 1 ? `
          <div class="course-playlist-section">
            <div class="playlist-header">
              <div>
                <div class="playlist-label">Playlist</div>
                <div class="playlist-course-title">${crs ? crs.title : 'Senarai Video'}</div>
              </div>
              <div class="playlist-stat">
                ${playlist.items.filter(s => completedSet.has(s.id)).length} / ${playlist.items.length} Selesai · ${Math.round((playlist.items.filter(s => completedSet.has(s.id)).length / playlist.items.length) * 100)}%
              </div>
            </div>
            <div class="playlist-progress-bar">
              <div class="playlist-progress-fill" style="width: ${(playlist.items.filter(s => completedSet.has(s.id)).length / playlist.items.length) * 100}%"></div>
            </div>
            <div class="playlist-scroll-row" id="playlist-scroll-row">
              ${playlist.items.map((sib, sIdx) => {
                const sibDone = completedSet.has(sib.id);
                const isCurrent = sib.id === mod.id;
                const sibThumb = sib.thumbnail_url || 'https://media.base44.com/images/public/6ac023b2ca93856d6db5ad7c/21bcae3f8_logo.png';
                return `
                  ${sib.is_chapter_start ? `
                    <div class="playlist-chapter-card">
                      <p class="playlist-chapter-num">Chapter ${sib.chapter_number}</p>
                      <p class="playlist-chapter-title">${sib.chapter_title}</p>
                    </div>
                  ` : ''}
                  <a href="#/module/${sib.id}" class="playlist-item-card ${isCurrent ? 'active' : ''}" id="${isCurrent ? 'active-playlist-item' : ''}">
                    <div class="playlist-thumb-box">
                      <img src="${sibThumb}" alt="${sib.title}" class="playlist-thumb-img" loading="lazy" />
                      ${sibDone ? `<span class="playlist-done-badge">✓</span>` : ''}
                      ${isCurrent ? `<span class="playlist-now-badge">SEDANG DITONTON</span>` : ''}
                      ${sib.duration_minutes ? `<span class="playlist-duration-badge">${sib.duration_minutes}m</span>` : ''}
                    </div>
                    <div class="playlist-item-body">
                      <div class="playlist-item-num">#${sIdx + 1}</div>
                      <div class="playlist-item-title" title="${sib.title}">${sib.title}</div>
                    </div>
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        ` : ''}

        <div class="module-footer-nav">
          ${prevMod ? `
            <a href="#/module/${prevMod.id}" class="btn-nav-step">
              ← Video Sebelum (${prevMod.title})
            </a>
          ` : `<div></div>`}
          ${nextMod ? `
            <a href="#/module/${nextMod.id}" class="btn-nav-step primary">
              Video Seterusnya (${nextMod.title}) →
            </a>
          ` : `<div></div>`}
        </div>
      `;

      container.innerHTML = html;

      // Scroll playlist to active card
      setTimeout(() => {
        const activeItem = document.getElementById('active-playlist-item');
        const scrollRow = document.getElementById('playlist-scroll-row');
        if (activeItem && scrollRow) {
          const offset = activeItem.offsetLeft - (scrollRow.clientWidth - activeItem.clientWidth) / 2;
          scrollRow.scrollTo({ left: Math.max(0, offset), behavior: 'smooth' });
        }
      }, 100);
    }

    function getCoursePlaylist(mod) {
      if (!mod || !mod.course_id) return { items: [], prev: null, next: null };
      const r = (a, b) => (a.order || 0) - (b.order || 0);
      const courseChapters = chapters.filter(ch => ch.course_id === mod.course_id).sort(r);
      const items = [];

      // 1. Direct modules without chapter
      modules.filter(m => m.course_id === mod.course_id && !m.chapter_id).sort(r).forEach(m => {
        items.push({ ...m, is_chapter_start: false });
      });

      // 2. Modules grouped by chapter in order
      courseChapters.forEach((ch, chIdx) => {
        const chInfo = { chapter_title: ch.title, chapter_number: chIdx + 1 };
        modules.filter(m => m.chapter_id === ch.id).sort(r).forEach((m, mIdx) => {
          items.push({ ...m, ...chInfo, is_chapter_start: mIdx === 0 });
        });
      });

      const currIdx = items.findIndex(m => m.id === mod.id);
      return {
        items: items,
        prev: currIdx > 0 ? items[currIdx - 1] : null,
        next: currIdx >= 0 && currIdx < items.length - 1 ? items[currIdx + 1] : null
      };
    }

    let activeNoteTabIndex = 0;
    function switchNoteTab(idx) {
      activeNoteTabIndex = idx;
      document.querySelectorAll('.note-tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.note-tab-content').forEach((c, i) => c.classList.toggle('active', i === idx));
    }

    function copyActiveNoteTab(modId) {
      const mod = modules.find(m => m.id === modId);
      if (mod && mod.note_tabs && mod.note_tabs[activeNoteTabIndex]) {
        const text = mod.note_tabs[activeNoteTabIndex].content || '';
        navigator.clipboard.writeText(text).then(() => {
          showToast('Nota berjaya disalin!', '📋');
          const btnText = document.getElementById('copy-tab-text');
          if (btnText) {
            btnText.textContent = 'Disalin!';
            setTimeout(() => { if (btnText) btnText.textContent = 'Salin Nota'; }, 1500);
          }
        });
      }
    }

    /* Actions */
    function toggleDone(modId) {
      if (completedSet.has(modId)) {
        completedSet.delete(modId);
        showToast('Ditanda belum selesai', '○');
      } else {
        completedSet.add(modId);
        triggerConfetti();
        showToast('Tahniah! Modul telah diselesaikan!', '🎉');
      }
      localStorage.setItem('ca_completed', JSON.stringify([...completedSet]));
      router();
    }

    function toggleBookmark(modId) {
      if (bookmarkedSet.has(modId)) {
        bookmarkedSet.delete(modId);
        showToast('Simpanan dipadam', '☆');
      } else {
        bookmarkedSet.add(modId);
        showToast('Modul disimpan ke senarai', '★');
      }
      localStorage.setItem('ca_bookmarked', JSON.stringify([...bookmarkedSet]));
      router();
    }

    function copyNotes(modId) {
      const mod = modules.find(m => m.id === modId);
      if (mod && mod.notes) {
        navigator.clipboard.writeText(mod.notes).then(() => showToast('Nota berjaya disalin!', '📋'));
      }
    }

    function checkQuiz(btn, chosen, correct, explain) {
      const parent = btn.closest('.quiz-card');
      const allBtns = parent.querySelectorAll('.quiz-btn');
      allBtns.forEach(b => b.classList.remove('correct', 'wrong'));
      if (chosen === correct) {
        btn.classList.add('correct');
        showToast('Jawapan Tepat!', '✨');
      } else {
        btn.classList.add('wrong');
        allBtns[correct].classList.add('correct');
      }
      const expEl = parent.querySelector('.quiz-explanation');
      if (expEl) {
        expEl.innerHTML = `<strong>💡 Penjelasan:</strong> ${explain || 'Kaji semula konsep dalam video.'}`;
        expEl.style.display = 'block';
      }
    }

    function toggleTheater() {
      isTheater = !isTheater;
      const card = document.getElementById('video-card');
      if (card) card.classList.toggle('theater', isTheater);
    }

    function setSpeed(spd) {
      currentSpeed = spd;
      const iframe = document.querySelector('.video-player-frame iframe');
      document.querySelectorAll('.ctrl-btn').forEach(b => {
        if (b.innerText.includes('x')) b.classList.toggle('active', b.innerText === `${spd}x`);
      });
      showToast(`Kelajuan Video: ${spd}x`, '⚡');
    }

    function jumpVideo(sec) {
      showToast(`Lompat ${sec > 0 ? '+' : ''}${sec} saat`, '⏩');
    }

    /* Global Search */
    function toggleSearchModal() {
      const modal = document.getElementById('search-modal');
      const input = document.getElementById('global-search-input');
      modal.classList.toggle('open');
      if (modal.classList.contains('open') && input) {
        input.value = '';
        renderSearchResults('');
        setTimeout(() => input.focus(), 50);
      }
    }

    function closeSearchModal(e) {
      if (e.target.id === 'search-modal') toggleSearchModal();
    }

    function renderSearchResults(query) {
      const resContainer = document.getElementById('search-results');
      if (!resContainer) return;
      const q = (query || '').toLowerCase().trim();
      if (!q) {
        resContainer.innerHTML = `<p style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:0.85rem;">Taip untuk mencari dari 408 video lessons...</p>`;
        return;
      }
      const matched = modules.filter(m => 
        (m.title && m.title.toLowerCase().includes(q)) || 
        (m.notes && m.notes.toLowerCase().includes(q)) ||
        (m.description && m.description.toLowerCase().includes(q))
      );
      if (matched.length === 0) {
        resContainer.innerHTML = `<p style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:0.85rem;">Tiada video dijumpai untuk "${query}".</p>`;
        return;
      }
      resContainer.innerHTML = matched.slice(0, 30).map(m => {
        const crs = courses.find(c => c.id === m.course_id);
        return `
          <a href="#/module/${m.id}" class="search-result-item" onclick="toggleSearchModal()">
            <div>
              <div class="search-result-title">${m.title}</div>
              <div class="search-result-badge">${crs ? crs.title : ''}</div>
            </div>
            <span style="color:var(--primary);font-size:1.1rem;">›</span>
          </a>
        `;
      }).join('');
    }

    /* Global Event Listeners */
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme(currentTheme);
      router();

      const searchInput = document.getElementById('global-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
      }

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          if (e.key === 'Escape') toggleSearchModal();
          return;
        }
        if (e.key === '/') {
          e.preventDefault();
          toggleSearchModal();
        }
        if (e.key === 'd' || e.key === 'D') toggleTheme();
      });
    });
  </script>
</body>
</html>
